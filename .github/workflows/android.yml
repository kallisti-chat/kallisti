# The Android app (APK, arm64). Pushes to main that touch it: the APK as a
# download on the run. Tags v*: also on the release (the desktop workflow
# makes the draft). Signed with the release key from repository secrets
# (ANDROID_KEYSTORE: the keystore in base64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD); without them a debug build,
# whose key changes with every run (an update then needs an uninstall).
name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - apps/desktop/**
      - apps/web/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write # the release (tags only)

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNED: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Its default list has "tools", which the SDK no longer has.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Android SDK and NDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.1.0" "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile

      - name: Release key
        if: env.SIGNED == 'true'
        working-directory: apps/desktop/src-tauri/gen/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        working-directory: apps/desktop
        run: |
          if [ "$SIGNED" = true ]; then
            pnpm exec tauri android build --apk --target aarch64
            apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          else
            pnpm exec tauri android build --apk --target aarch64 --debug
            apk=src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          fi
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          suffix=$([ "$SIGNED" = true ] && echo "" || echo "-debug")
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/kallisti-$version-arm64$suffix.apk"
          ls -l "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kallisti-android
          path: ${{ runner.temp }}/out/*.apk

      # Tags: onto the draft release the desktop workflow makes (it may not
      # exist yet: wait for it a while).
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/out/*.apk --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            sleep 30
          done
          exit 1
