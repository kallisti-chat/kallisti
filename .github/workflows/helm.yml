name: helm chart

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read only: checks need no write access.
permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: helm lint deploy/kubernetes/chart -f deploy/kubernetes/chart/ci/values.yaml --strict
      - run: python tests/deploy/helm_chart.py
