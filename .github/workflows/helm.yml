name: helm chart

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read only: checks need no write access.
permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: helm lint deploy/kubernetes/chart -f deploy/kubernetes/chart/ci/values.yaml --strict
      - run: python tests/deploy/helm_chart.py
