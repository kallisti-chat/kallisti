# candidate code runs only in the ordinary unprivileged pull request context.
name: preview build
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: unit
            os: ubuntu-latest
          - task: desktop
            os: ubuntu-22.04
          - task: chart
            os: ubuntu-latest
          - task: chrome
            os: ubuntu-latest
          - task: firefox
            os: ubuntu-latest
          - task: safari
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: server/go.mod
          cache: false
      - if: matrix.task == 'unit'
        run: |
          pnpm install --frozen-lockfile
          pnpm -r typecheck
          pnpm -r test
          cd server
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - if: matrix.task == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - if: matrix.task == 'desktop'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - if: matrix.task == 'desktop'
        run: |
          mkdir -p apps/web/dist
          cd apps/desktop/src-tauri
          cargo test --locked
      - if: matrix.task == 'chart'
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v4.2.2
      - if: matrix.task == 'chart'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - if: matrix.task == 'chart'
        run: |
          python -m pip install PyYAML==6.0.3
          helm lint deploy/kubernetes/chart -f deploy/kubernetes/chart/ci/values.yaml --strict
          python tests/deploy/helm_chart.py
      - if: contains(fromJSON('["chrome","firefox","safari"]'), matrix.task)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web build
      - if: matrix.task == 'chrome' || matrix.task == 'firefox'
        run: |
          sudo apt-get update && sudo apt-get install -y pulseaudio
          pulseaudio -D --exit-idle-time=-1
      - if: contains(fromJSON('["chrome","firefox","safari"]'), matrix.task)
        env:
          BROWSER: ${{ matrix.task }}
        run: |
          case "$BROWSER" in
            chrome) "$CHROMEWEBDRIVER/chromedriver" --port=4444 & ;;
            firefox) "$GECKOWEBDRIVER/geckodriver" --port 4444 & ;;
            safari) sudo safaridriver --enable && sudo safaridriver -p 4444 & ;;
          esac
          sleep 2
          tests/voice/run.sh "$BROWSER" http://localhost:4444
  build:
    needs: check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: preview:archive
          outputs: type=docker,dest=/tmp/preview.tar
          # no registry login, push, shared caches or deployment credentials.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-image-${{ github.run_attempt }}
          path: /tmp/preview.tar
          retention-days: 1
          compression-level: 0
