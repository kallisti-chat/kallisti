name: preview controller
on:
  pull_request:
    paths: ['deploy/preview/**', 'server/cmd/preview-init/**', '.github/workflows/preview*.yml']
  push:
    branches: [main]
    paths: ['deploy/preview/**', 'server/**', '.github/workflows/preview*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: deploy/preview/go.mod
          cache-dependency-path: deploy/preview/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: python3 -m pip install PyYAML==6.0.3
      - run: make -C deploy/preview check workflow-check smoke
      - run: cd server && go vet ./cmd/preview-init && go test -race ./cmd/preview-init
  image:
    needs: test
    if: github.repository == 'kallisti-chat/kallisti' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/preview/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kallisti-chat/kallisti-preview-controller:${{ github.sha }}
