# Voice in real browsers: frame numbers and terminators, checked on the wire
# (tests/voice/run.sh).
name: voice

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read only: checks need no write access.
permissions:
  contents: read

jobs:
  voice:
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            os: ubuntu-latest
          - browser: firefox
            os: ubuntu-latest
          - browser: safari
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build

      # Without a sound device, browsers do not run audio.
      - name: Sound device (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y pulseaudio
          pulseaudio -D --exit-idle-time=-1
      - name: WebDriver
        run: |
          case ${{ matrix.browser }} in
            chrome) "$CHROMEWEBDRIVER/chromedriver" --port=4444 & ;;
            firefox) "$GECKOWEBDRIVER/geckodriver" --port 4444 & ;;
            safari) sudo safaridriver --enable && safaridriver -p 4444 & ;;
          esac
          sleep 2

      - run: tests/voice/run.sh ${{ matrix.browser }} http://localhost:4444
