# Voice in real browsers: frame numbers and terminators, checked on the wire
# (tests/voice/run.sh).
name: voice

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read only: checks need no write access.
permissions:
  contents: read

jobs:
  voice:
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            os: ubuntu-latest
          - browser: firefox
            os: ubuntu-latest
          - browser: safari
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build

      # Without a sound device, browsers do not run audio.
      - name: Sound device (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y pulseaudio
          pulseaudio -D --exit-idle-time=-1
      - name: WebDriver
        run: |
          case ${{ matrix.browser }} in
            chrome) "$CHROMEWEBDRIVER/chromedriver" --port=4444 & ;;
            firefox) "$GECKOWEBDRIVER/geckodriver" --port 4444 & ;;
            safari) sudo safaridriver --enable && safaridriver -p 4444 & ;;
          esac
          sleep 2

      - run: tests/voice/run.sh ${{ matrix.browser }} http://localhost:4444
