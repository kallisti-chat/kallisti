packages:
  - "packages/*"
  - "apps/*"
# Translation runs in browsers; these native Node backends are unused.
overrides:
  "@huggingface/transformers>onnxruntime-node": "-"
  "@huggingface/transformers>sharp": "-"
allowBuilds:
  esbuild: false # tsx uses the platform binary from esbuild's optional dependencies
  protobufjs: false # not needed (it comes with the noise package's voice detection)
